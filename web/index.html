<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>rola · tu música</title>
  <link rel="stylesheet" href="/estilos.css">
  <script src="/reproductor.js" defer></script>
</head>
<body data-view="player">
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
      <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
      <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
      <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="previous" viewBox="0 0 24 24"><path d="M5 5v14m13-14L7 12l11 7Z"/></symbol>
      <symbol id="next" viewBox="0 0 24 24"><path d="M19 5v14M6 5l11 7-11 7Z"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="m8 4 8 8-8 8"/></symbol>
      <symbol id="refresh-icon" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    </defs>
  </svg>
  <header>
    <button id="theme" class="icon" aria-label="Activar modo noche" title="Activar modo noche">
      <svg aria-hidden="true"><use href="#moon"/></svg>
    </button>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite">
      <span id="message">Cargando tu música…</span>
      <button id="retry" hidden>Reintentar</button>
    </div>
    <section id="player" aria-label="Reproductor">
      <div class="disc" role="img" aria-label="CD sin portada">
        <div class="disc-spin"><img id="cover" alt="" hidden></div>
      </div>
      <div class="metadata"><h1 id="title" tabindex="-1">Elige una canción</h1><p id="artist">Tu música, a tu ritmo.</p></div>
      <div class="timeline">
        <input id="seek" aria-label="Posición de reproducción" type="range" min="0" max="1" step="0.1" value="0" disabled>
        <div class="times"><span id="elapsed">0:00</span><span id="remaining">−0:00</span></div>
      </div>
      <div class="controls">
        <button id="previous-track" class="icon" aria-label="Canción anterior" disabled><svg aria-hidden="true"><use href="#previous"/></svg></button>
        <button class="icon toggle primary" aria-label="Reproducir" disabled><svg aria-hidden="true"><use href="#play"/></svg></button>
        <button id="next-track" class="icon" aria-label="Canción siguiente" disabled><svg aria-hidden="true"><use href="#next"/></svg></button>
      </div>
    </section>
    <section id="library" aria-labelledby="library-title" hidden>
      <h1 id="library-title" tabindex="-1">Biblioteca</h1>
      <div class="library-info"><span id="count">Un lugar para tus discos.</span><button id="refresh" class="icon" aria-label="Actualizar biblioteca" title="Actualizar biblioteca"><svg aria-hidden="true"><use href="#refresh-icon"/></svg></button></div>
      <div id="albums"></div>
      <section id="album-detail" aria-labelledby="album-title" hidden>
        <div class="detail-heading">
          <div><h2 id="album-title"></h2><p id="album-artist"></p></div>
          <button id="close-album" class="icon" aria-label="Cerrar álbum"><svg aria-hidden="true"><use href="#close"/></svg></button>
        </div>
        <ol id="tracks"></ol>
      </section>
    </section>
  </main>
  <footer>
    <button id="mode"><span id="mode-label">Biblioteca</span> <svg aria-hidden="true"><use href="#arrow"/></svg></button>
  </footer>
  <template id="album-template">
    <button class="album" aria-expanded="false" aria-controls="album-detail">
      <span class="artwork"><img alt="" loading="lazy" decoding="async"></span>
      <span class="album-title"></span><small class="album-artist"></small>
    </button>
  </template>
  <template id="track-template">
    <li><button class="track"><span class="track-number"></span><span class="track-title"></span><span class="track-length"></span></button></li>
  </template>
  <audio id="audio" preload="metadata"></audio>
  <noscript>Activa JavaScript para explorar tu música y usar el reproductor.</noscript>
</body>
</html>
